name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# Pricing baseline bundled into release artifacts (tar.gz + docker image). The
# JSON is NOT vendored in the repo; it is fetched fresh at build time so each
# release ships a working LiteLLM price table. Operators can still refresh it
# at runtime via pricing.source_url.
env:
  LITELLM_PRICING_URL: https://raw.githubusercontent.com/BerriAI/litellm/main/model_prices_and_context_window.json

jobs:
  validate-version:
    name: Validate release version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Match tag to VERSION
        shell: bash
        run: |
          set -euo pipefail
          project_version="$(tr -d '[:space:]' < VERSION)"
          semver="${project_version#v}"
          if [[ "${semver}" =~ ^[0-9]+\.[0-9]+$ ]]; then
            semver="${semver}.0"
          fi
          expected_tag="v${semver}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "release tag ${GITHUB_REF_NAME} does not match VERSION ${project_version} (${expected_tag})" >&2
            exit 1
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: validate-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            os: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: ""
            archive: tar.gz
          - target: linux-arm64
            os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            ext: ""
            archive: tar.gz
          # darwin-amd64 (Intel Macs) was dropped: macos-13 is the last
          # Intel runner image GitHub offers, the queue depth is unreliable
          # (jobs frequently stall waiting for a free runner), and Intel Mac
          # share among devs has been declining since 2020. Users on Intel
          # Macs can build from source: `go build ./cmd/server`.
          - target: darwin-arm64
            os: macos-latest
            goos: darwin
            goarch: arm64
            ext: ""
            archive: tar.gz
          # windows-amd64 was dropped (v2.2.0): the GitHub runner's mingw
          # toolchain (gcc >= 13) removed the std::call_once emutls symbols
          # that duckdb-go-bindings' prebuilt static libs still reference,
          # so the cgo link fails and upstream has not rebuilt the libs.
          # Windows users should run the multi-arch Docker image instead:
          # ghcr.io/kurok1/claude-code-monitor (built by the jobs below).

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend (embed into binary)
        shell: bash
        working-directory: frontend
        run: |
          set -euo pipefail
          npm ci
          npm run build
          # Sanity: vite writes to ../internal/web/dist; //go:embed all:dist
          # in internal/web/web.go picks it up. If this file is missing the
          # released binary would silently fall back to the plain-text "/"
          # page — fail fast instead.
          test -f ../internal/web/dist/index.html

      - name: Build
        env:
          CGO_ENABLED: '1'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          PROJECT_VERSION="$(tr -d '[:space:]' < VERSION)"
          mkdir -p dist
          NAME="claude-code-monitor_${RELEASE_TAG}_${{ matrix.target }}"
          go build -trimpath \
            -ldflags "-s -w -X github.com/kuroky/claude-code-monitor/internal/buildinfo.version=${PROJECT_VERSION}" \
            -o "dist/${NAME}/claude-code-monitor${{ matrix.ext }}" ./cmd/server
          cp config.example.yaml "dist/${NAME}/"
          # Bundle the LiteLLM price table so `pricing.source_file: ./pricing/litellm.json`
          # works out of the box from the extracted archive. Fetched at build time
          # (not vendored); fail the release if it can't be retrieved.
          mkdir -p "dist/${NAME}/pricing"
          curl -fsSL --retry 5 --retry-delay 2 -o "dist/${NAME}/pricing/litellm.json" "${LITELLM_PRICING_URL}"
          tar -C dist -czf "dist/${NAME}.tar.gz" "${NAME}"
          ( cd dist && shasum -a 256 "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256" )

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          # Filter to binary build artifacts only. Without a pattern, this
          # step also pulls the docker-digests-* artifacts (0-byte hex-named
          # files used by the docker-manifest job) and their unzip fails the
          # whole release step.
          pattern: '{linux,darwin}-*'
          merge-multiple: true

      - name: Aggregate checksums
        run: |
          set -euo pipefail
          cd dist
          cat *.sha256 > checksums.txt
          ls -lh

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true

  docker-build:
    name: Docker ${{ matrix.arch }}
    needs: validate-version
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          provenance: false
          build-args: |
            LITELLM_PRICING_URL=${{ env.LITELLM_PRICING_URL }}
          # push-by-digest emits only an arch-specific manifest blob (no tag).
          # The downstream docker-manifest job stitches them into a multi-arch
          # tag list so the release publishes one logical image, not two.
          outputs: type=image,name=${{ steps.img.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: docker-digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-manifest:
    name: Docker manifest
    needs: docker-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: docker-digests-*
          path: /tmp/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          # Disable the action's auto "latest" — we enable it explicitly below
          # only for stable tags (no `-rc1` / `-beta.X` suffix).
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          tag_args=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<<'${{ steps.meta.outputs.json }}')
          digest_refs=$(printf '${{ steps.img.outputs.name }}@sha256:%s ' *)
          docker buildx imagetools create $tag_args $digest_refs

      - name: Inspect image
        run: docker buildx imagetools inspect ${{ steps.img.outputs.name }}:${{ steps.meta.outputs.version }}
