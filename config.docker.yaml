server:
  grpc_listen: "0.0.0.0:4317"

storage:
  duckdb_path: "/data/monitor.duckdb"

ingest:
  batch_size: 500
  flush_interval: "5s"
  buffer_hard_limit: 50000

capture:
  enabled: false
  dir: "/data/captured"

stats:
  listen: "0.0.0.0:9100"
  enable_pprof: false

dashboard:
  top_n:
    tools: 10
    skills: 10
  timezone: "Asia/Shanghai"

archive:
  enabled: false

logging:
  level: "info"
  format: "json"

# 第三方模型成本估算(Codex 等)。默认关闭。
# 镜像已在构建时内置 /etc/claude-code-monitor/pricing/litellm.json,取消注释即可启用;
# source_url 用于运行期定期刷新(可选,留空则仅用内置文件)。
# pricing:
#   enabled: true
#   source_file: /etc/claude-code-monitor/pricing/litellm.json
#   source_url: "https://raw.githubusercontent.com/BerriAI/litellm/main/model_prices_and_context_window.json"
#   refresh_interval: 24h
