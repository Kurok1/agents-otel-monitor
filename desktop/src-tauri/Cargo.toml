# @author Kurok1 <im.kurokyhanc@gmail.com>
# @since 3.0.0

[package]
name = "vibecoding-monitor"
version = "3.0.1"
description = "A macOS menu bar dashboard for claude-code-monitor"
authors = ["Kurok1 <im.kurokyhanc@gmail.com>"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "vibecoding_monitor_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.11.5", features = ["image-png", "macos-private-api", "tray-icon"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-positioner = { version = "2.3.3", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.4.3"
thiserror = "2.0.20"
url = "2.5.8"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
